name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -I scripts/check.py
      - run: node _shared/skills/anti-slop/slopcheck.mjs --self-test
      - run: node _shared/skills/anti-slop/ref.mjs --self-test
